server:
  port: 8080

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - com.ecommerce.common.config.CommonLibraryAutoConfiguration
      - org.springframework.boot.security.reactive.autoconfigure.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.security.reactive.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
