server:
  port: 8080

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - com.ecommerce.common.config.CommonLibraryAutoConfiguration
      - org.springframework.boot.security.reactive.autoconfigure.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.security.reactive.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rikkeiacademy}
      timeout: 2000ms
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:100}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:200}
            key-resolver: "#{@userKeyResolver}"
            deny-empty-key: false
      routes:
        - id: identity-public-auth
          uri: http://${IDENTITY_SERVICE_URL:localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          metadata:
            targetService: identity-service

        - id: identity-protected-users
          uri: http://${IDENTITY_SERVICE_URL:localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**
          metadata:
            targetService: identity-service

        - id: catalog-public
          uri: http://${CATALOG_SERVICE_URL:catalog-service:8082}
          predicates:
            - Path=/api/v1/catalog/products/**, /api/v1/catalog/categories/**, /api/v1/catalog/brands/**, /api/v1/catalog/search/**
          metadata:
            targetService: catalog-service

        - id: catalog-admin
          uri: http://${CATALOG_SERVICE_URL:catalog-service:8082}
          predicates:
            - Path=/api/v1/catalog/admin/**
          metadata:
            targetService: catalog-service

        - id: inventory-service-routes
          uri: http://${INVENTORY_SERVICE_URL:inventory-service:8083}
          predicates:
            - Path=/api/v1/inventory/**
          metadata:
            targetService: inventory-service

        - id: order-service-routes
          uri: http://${ORDER_SERVICE_URL:order-service:8084}
          predicates:
            - Path=/api/v1/orders/**
          metadata:
            targetService: order-service

        - id: payment-momo-ipn-webhook
          uri: http://${PAYMENT_SERVICE_URL:payment-service:8085}
          predicates:
            - Path=/api/v1/payments/momo/ipn
            - Method=POST
          metadata:
            targetService: payment-service

        - id: payment-service-routes
          uri: http://${PAYMENT_SERVICE_URL:payment-service:8085}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/admin/payments/**
          metadata:
            targetService: payment-service

        - id: notification-admin-routes
          uri: http://${NOTIFICATION_SERVICE_URL:notification-service:8086}
          predicates:
            - Path=/api/v1/admin/notifications/**
          metadata:
            targetService: notification-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret-key: "${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}"
  whitelist-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/verify-email
    - /api/v1/auth/resend-verification
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh-token
    - /api/v1/auth/refresh
    - /identity/api/v1/auth/register
    - /identity/api/v1/auth/login
    - /identity/api/v1/auth/verify-email
    - /identity/api/v1/auth/resend-verification
    - /identity/api/v1/auth/forgot-password
    - /identity/api/v1/auth/reset-password
    - /identity/api/v1/auth/refresh-token
    - /identity/api/v1/auth/refresh
    - /api/auth/register
    - /api/auth/login
    - /api/auth/verify-email
    - /api/auth/resend-verification
    - /api/auth/forgot-password
    - /api/auth/reset-password
    - /api/auth/refresh-token
    - /api/auth/refresh
    - /api/v1/catalog/products/**
    - /api/v1/catalog/categories/**
    - /api/v1/catalog/brands/**
    - /api/v1/catalog/search/**
    - /api/v1/payments/momo/ipn
    - /actuator/**

