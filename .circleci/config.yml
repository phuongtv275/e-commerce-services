version: 2.1

commands:
  run-module-test:
    parameters:
      module:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-dependencies-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}
            - v1-gradle-dependencies-
      - run:
          name: Make Gradle Wrapper Executable
          command: chmod +x gradlew
      - run:
          name: Run << parameters.module >> Tests
          command: ./gradlew :<< parameters.module >>:test --no-daemon --stacktrace
      - run:
          name: Collect Test Results and Reports
          when: always
          command: |
            mkdir -p build/test-results build/reports/tests
            find << parameters.module >> -type f -name "TEST-*.xml" -exec cp {} build/test-results/ \; || true
            if [ -d "<< parameters.module >>/build/reports/tests/test" ]; then
              mkdir -p "build/reports/tests/<< parameters.module >>"
              cp -r << parameters.module >>/build/reports/tests/test/* "build/reports/tests/<< parameters.module >>/" || true
            fi
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-dependencies-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: build/test-results
      - store_artifacts:
          path: build/reports/tests

jobs:
  test-common-library:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: common-library

  test-config-server:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: config-server

  test-eureka-server:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: eureka-server

  test-api-gateway:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: api-gateway

  test-identity-service:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: identity-service

  test-catalog-service:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: catalog-service

  test-inventory-service:
    docker:
      - image: cimg/openjdk:21.0
        environment:
          INVENTORY_TEST_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
          INVENTORY_TEST_DB_HOST: postgres
      - image: postgres:16-alpine
        environment:
          POSTGRES_DB: inventory_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && exit 0
              sleep 1
            done
            exit 1
      - run-module-test:
          module: inventory-service

  test-order-service:
    docker:
      - image: cimg/openjdk:21.0
        environment:
          ORDER_TEST_DB_URL: jdbc:postgresql://postgres:5432/order_db
          ORDER_TEST_DB_HOST: postgres
      - image: postgres:16-alpine
        environment:
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && exit 0
              sleep 1
            done
            exit 1
      - run-module-test:
          module: order-service

  notification-tests:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - run-module-test:
          module: notification-service

workflows:
  version: 2
  pipeline:
    jobs:
      - test-common-library
      - test-config-server
      - test-eureka-server
      - test-api-gateway
      - test-identity-service:
          requires:
            - test-common-library
      - test-catalog-service:
          requires:
            - test-common-library
      - test-inventory-service:
          requires:
            - test-common-library
      - test-order-service:
          requires:
            - test-common-library
      - notification-tests:
          requires:
            - test-common-library
