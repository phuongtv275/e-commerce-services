version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-dependencies-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}
            - v1-gradle-dependencies-
      - run:
          name: Make Gradle Wrapper Executable
          command: chmod +x gradlew
      - run:
          name: Build and Run Tests
          command: ./gradlew test --no-daemon --stacktrace
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-dependencies-{{ checksum "settings.gradle" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: build/test-results
      - store_artifacts:
          path: build/reports/tests

workflows:
  version: 2
  pipeline:
    jobs:
      - build-and-test
