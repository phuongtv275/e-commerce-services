name: ecom

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecom-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      IDENTITY_SERVICE_URL: identity-service:8081
      CATALOG_SERVICE_URL: catalog-service:8082
      INVENTORY_SERVICE_URL: inventory-service:8083
      ORDER_SERVICE_URL: order-service:8084
      PAYMENT_SERVICE_URL: payment-service:8085
      NOTIFICATION_SERVICE_URL: notification-service:8086
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: rikkeiacademy
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GATEWAY_ASSERTION_PRIVATE_KEY: ${GATEWAY_ASSERTION_PRIVATE_KEY}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom_frontend_net
      - ecom_backend_net
      - ecom_data_net

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: ecom-identity-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: rikkeiacademy
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
      INTERNAL_KEY_ORDER: ${INTERNAL_KEY_ORDER}
      INTERNAL_KEY_NOTIFICATION: ${INTERNAL_KEY_NOTIFICATION}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom_backend_net
      - ecom_data_net

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: ecom-catalog-service
    restart: always
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
      INTERNAL_KEY_ORDER: ${INTERNAL_KEY_ORDER}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - ecom_backend_net
      - ecom_data_net

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: ecom-inventory-service
    restart: always
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
      INTERNAL_KEY_ORDER: ${INTERNAL_KEY_ORDER}
      INTERNAL_KEY_PAYMENT: ${INTERNAL_KEY_PAYMENT}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - ecom_backend_net
      - ecom_data_net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecom-order-service
    restart: always
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
      INTERNAL_KEY_ORDER: ${INTERNAL_KEY_ORDER}
      INTERNAL_KEY_PAYMENT: ${INTERNAL_KEY_PAYMENT}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecom_backend_net
      - ecom_data_net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ecom-payment-service
    restart: always
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
      INTERNAL_KEY_PAYMENT: ${INTERNAL_KEY_PAYMENT}
      ORDER_SERVICE_URL: http://order-service:8084
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_IP_ADDRESS: ${VNPAY_IP_ADDRESS}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_VERSION: ${VNPAY_VERSION:-2.1.0}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE:-other}
      VNPAY_LOCALE: ${VNPAY_LOCALE:-vn}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - ecom_backend_net
      - ecom_data_net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecom-notification-service
    restart: always
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      GATEWAY_ASSERTION_PUBLIC_KEY: ${GATEWAY_ASSERTION_PUBLIC_KEY}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecom_backend_net
      - ecom_data_net
