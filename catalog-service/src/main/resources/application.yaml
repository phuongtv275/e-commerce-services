server:
  port: 8082

spring:
  application:
    name: catalog-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    elasticsearch:
      repositories:
        enabled: ${SPRING_DATA_ELASTICSEARCH_REPOSITORIES_ENABLED:false}
  kafka:
    listener:
      ack-mode: manual

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  gateway-assertion:
    public-key: "${GATEWAY_ASSERTION_PUBLIC_KEY:}"
  internal-service-keys:
    order-service: "${INTERNAL_KEY_ORDER:}"

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
