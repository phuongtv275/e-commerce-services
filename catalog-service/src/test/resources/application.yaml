spring:
  application:
    name: catalog-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:catalog_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  data:
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual

eureka:
  client:
    enabled: false

