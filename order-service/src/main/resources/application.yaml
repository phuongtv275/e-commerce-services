server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: ${order.kafka.consumer-group:order-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

security:
  gateway-assertion:
    public-key: "${GATEWAY_ASSERTION_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1rYaNGEBN4TFHrxLtu91\natHxmWjLaEduLAEZsrGEMj1czx1iKP4DZjCIicBq/CAnrKx/hjum2yTgfV8HcaBR\nY1dcQ5Mzix4nRCx3EjWyUEdFkGr9Li9PORUU4O+NMpg0BfUhBeclkx78oz4rq3wd\nBWXBHBmPPPLbKACHQnUCwynUmFm7u/2VUbF8ynuOBJFETtk1xO5krePJpp8yKlc5\ngddhRDhl9GS7+n/em/HVBkZx4NLJUJS9Y4M12euiHsZrZLJUVDL2hGbjPWWB+JPb\niqYNaD+QGVr9+go5NKHUCwXot/D7UIjI14d0xQYiVKZqqDzwgJyoGHTQxyH8EkxK\nnwIDAQAB\n-----END PUBLIC KEY-----}"
  internal-service-keys:
    payment-service: ${INTERNAL_SERVICE_KEYS_PAYMENT_SERVICE:${INTERNAL_KEY_PAYMENT:a1fb2971af06749e5ef5f695720338b5611f6fa8d51bbbb476db7ab2eec22319}}
    notification-service: ${INTERNAL_SERVICE_KEYS_NOTIFICATION_SERVICE:${INTERNAL_KEY_NOTIFICATION:}}

services:
  catalog-service:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    internal-key: ${INTERNAL_KEY_ORDER:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
    internal-key: ${INTERNAL_KEY_ORDER:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  identity-service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    internal-key: ${INTERNAL_KEY_ORDER:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

order:
  idempotency:
    retention-hours: 24
  kafka:
    consumer-group: order-service-group
    topic:
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      reservation-expired: inventory.reservation-expired
      reservation-commit-failed: inventory.reservation-commit-failed
      order-created: order.created
      order-status-changed: order.status-changed
      order-cancelled: order.cancelled
    consumer:
      max-attempts: 3
      initial-backoff-ms: 1000
      max-backoff-ms: 4000
      jitter-ms: 200
      dlt-suffix: .dlt
    dlt:
      payment-succeeded: order.payment-succeeded.dlt
      payment-failed: order.payment-failed.dlt
      reservation-expired: order.reservation-expired.dlt
      reservation-commit-failed: order.reservation-commit-failed.dlt

outbox:
  publisher:
    interval-ms: 2000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
