server:
  port: 8083

spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      group-id: inventory-reservation-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

inventory:
  kafka:
    consumer-group: inventory-reservation-group
    topic:
      payment-succeeded: payment.succeeded
      payment-failed: payment.failed
      order-cancelled: order.cancelled
    dlt:
      payment-succeeded: inventory.payment-succeeded.dlt
      payment-failed: inventory.payment-failed.dlt
      order-cancelled: inventory.order-cancelled.dlt
    consumer:
      max-attempts: 3
      initial-backoff-ms: 1000
      max-backoff-ms: 4000
      jitter-ms: 200
  reservation:
    ttl: 15m
    expiry-interval-ms: 30000
    expiry-initial-delay-ms: 10000
    expiry-batch-size: 100
  scheduler:
    expiry-interval: 30000
    expiry-initial-delay: 10000
    expiry-batch-size: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

