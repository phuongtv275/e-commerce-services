server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:rikkeiacademy}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}"
    access-token-expiration: 900000 # 15 mins
    refresh-token-expiration: 604800000 # 7 days

security:
  gateway-assertion:
    public-key: "${GATEWAY_ASSERTION_PUBLIC_KEY:}"
  internal-service-keys:
    order-service: "${INTERNAL_KEY_ORDER:order-service-secret-key-32chars}"
    notification-service: "${INTERNAL_KEY_NOTIFICATION:notification-service-secret-key-32c}"

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "