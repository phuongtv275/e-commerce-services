rootProject.name = 'e-commerce-services'

[
    'common-library',
    'api-gateway',
    'catalog-service',
    'config-server',
    'eureka-server',
    'identity-service',
    'inventory-service',
    'notification-service',
    'order-service',
    'payment-service'
].each { proj ->
    if (file(proj).exists()) {
        include proj
    }
}
